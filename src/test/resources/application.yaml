spring:
  application:
    name: moneylog

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:moneylog-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile

app:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes-long
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 1209600000
  admin:
    email: admin@moneylog.com
    password: test-admin-password
    username: 관리자
  frontend-url: http://localhost:3000

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui-custom.html
    enabled: true
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  model-and-view-allowed: true
